name: sags_py310
channels:
  - conda-forge
  - defaults
dependencies:
  # Core/runtime
  - python=3.10.19
  - pip=25.3
  - setuptools
  - wheel
  - ca-certificates
  - openssl

  # CUDA runtime (matching current env, CUDA 12.9 runtime + PyTorch 2.1.2 cu118 wheels)
  - cuda-version=12.9
  - cuda-cudart=12.9.79
  - cuda-cudart_linux-64=12.9.79

  # Colmap + deps
  - colmap=3.13.0
  - ceres-solver
  - suitesparse
  - eigen
  - freeimage
  - flann
  - vlfeat

  # Image/IO libs
  - libpng
  - libtiff
  - libjpeg-turbo
  - openexr
  - hdf5
  - cairo
  - qt-main

  # Python packages installed via pip
  - pip:
      - torch==2.1.2+cu118
      - torchvision==0.16.2+cu118
      - torchaudio==2.1.2+cu118
      - pytorch3d==0.7.5
      - diff-gaussian-rasterization==0.0.0
      - diff-gaussian-rasterization-depth==0.0.0
      - diff-gaussian-rasterization-contrastive-f==0.0.0
      - simple-knn==0.0.0
      - open-clip-torch==3.2.0
      - groundingdino==0.1.0
      - segment-anything==1.0
      - opencv-python==4.8.1.78
      - pillow==11.3.0
      - numpy==1.26.4
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.7
      - tqdm==4.67.1
      - plyfile==1.1.3
      - tabulate==0.9.0
      - yacs==0.1.8
      - ftfy==6.3.1
      - supervision==0.27.0
      - transformers==4.30.2
      - tokenizers==0.13.3
      - timm==1.0.22
      - hdbscan==0.8.40
      - iopath==0.1.10
      - portalocker==3.2.0
      - pycocotools==2.0.10
      - pygments
      - ipykernel
      - jupyter
      - jupyterlab
      - notebook
